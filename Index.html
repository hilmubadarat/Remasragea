<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسار ٦٠ يوم: من A1 إلى B2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8FC; --surface:#FFFFFF; --ink:#16213D; --muted:#5B6584; --line:#DCE2EE;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1528; --surface:#18203A; --ink:#E9EDF7; --muted:#9BA5C2; --line:#2B3555;
    --a1:#37C2AE; --a2:#6E95F5; --b1:#AE85EE; --b2:#F0B444; --done:#E9EDF7;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1528; --surface:#18203A; --ink:#E9EDF7; --muted:#9BA5C2; --line:#2B3555;
  --a1:#37C2AE; --a2:#6E95F5; --b1:#AE85EE; --b2:#F0B444; --done:#E9EDF7;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.75}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--a2);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
.en{direction:ltr;unicode-bidi:isolate;font-family:"Readex Pro",Arial,sans-serif}

header.hero{padding:44px 0 28px}
.hero h1{font-family:"Reem Kufi","Readex Pro",sans-serif;font-weight:700;font-size:clamp(34px,7vw,60px);line-height:1.15;margin:0 0 12px;letter-spacing:-.5px}
.hero p{margin:0;color:var(--muted);max-width:60ch;font-size:17px}
.track{display:flex;gap:4px;margin:28px 0 10px;height:14px}
.track span{flex:1;border-radius:7px;position:relative;overflow:hidden;background:var(--line)}
.track span i{position:absolute;inset:0 0 0 auto;width:0;transition:width .6s ease}
.track-labels{display:flex;gap:4px;font-size:14px;color:var(--muted)}
.track-labels div{flex:1}
.track-labels b{color:var(--ink);font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:18px;align-items:center}
.stats .big{font-family:"Reem Kufi",sans-serif;font-size:28px;font-weight:700}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}

nav.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:24px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:8px}
nav.tabs button{background:none;border:0;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}

.level{margin-bottom:34px}
.level-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.level-head h2{margin:0;font-family:"Reem Kufi",sans-serif;font-size:26px}
.level-head .tag{font-weight:700;padding:2px 10px;border-radius:6px;color:#fff;font-size:15px}
.level-head p{margin:0;color:var(--muted);font-size:15px;flex-basis:100%}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{display:flex;gap:10px;align-items:flex-start;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:76px}
.st:hover{border-color:var(--c)}
.st .n{flex:0 0 34px;height:34px;border-radius:50%;border:2.5px solid var(--c);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--c)}
.st.done .n{background:var(--c);color:#fff}
.st .t{font-size:13.5px;line-height:1.45}
.st .t small{display:block;color:var(--muted);font-size:12px}
.st.review{border-style:dashed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.panel h3{margin:0 0 8px;font-size:19px}
.panel p,.panel li{max-width:72ch}
.res-list{display:grid;gap:10px}
.res{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.res:hover{border-color:var(--ink)}
.res b{display:block}
.res span{color:var(--muted);font-size:14px}
.note{border-inline-start:4px solid var(--b2);padding:12px 16px;background:var(--surface);border-radius:8px;margin-bottom:16px}

/* Day sheet */
.overlay{position:fixed;inset:0;background:rgba(10,14,30,.45);display:none;z-index:20}
.overlay.open{display:block}
.sheet{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(640px,100%);background:var(--bg);z-index:21;overflow-y:auto;transform:translateX(100%);transition:transform .28s ease;padding:calc(env(safe-area-inset-top,0px) + 16px) 22px calc(env(safe-area-inset-bottom,0px) + 30px)}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.track span i{transition:none}}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.sheet h2{font-family:"Reem Kufi",sans-serif;font-size:30px;line-height:1.25;margin:6px 0 4px}
.sheet .meta{color:var(--muted);font-size:14px}
.sec{margin-top:22px}
.sec h3{font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sec h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:6px 0;text-align:left;font-size:15.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:14.5px;text-decoration:none}
.chip:hover{border-color:var(--c)}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:6px 0}
.task input{width:20px;height:20px;margin-top:4px;accent-color:var(--c);flex:0 0 auto}
.task.checked label{color:var(--muted);text-decoration:line-through}
.routine{font-size:14.5px;color:var(--muted);padding-inline-start:20px;margin:0}
.sheet-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px}
footer{color:var(--muted);font-size:13px;padding:30px 0}
</style>
</head>

<div class="wrap">

    <p>خطة يومية مفصّلة: درس قواعد، مفردات، مهام عملية ومصادر مجانية لكل يوم. اضغط على أي يوم لتفتح درسه وعلّم المهام اللي خلصتها.</p>
    <div class="track" id="track"></div>

    <div class="stats">

  </header>

    <button role="tab" aria-selected="false" data-tab="res">المصادر</button>
  </nav>

  <main>
    <section id="tab-plan"></section>
    <section id="tab-how" hidden></section>
    <section id="tab-res" hidden></section>
  </main>
  <footer>التقدّم محفوظ في متصفحك على هذا الجهاز فقط.</footer>
</div>

<div class="overlay" id="overlay"></div>

{lv:"A1",t:"there is / are وحروف الجر للمكان",g:"There is / there are + prepositions",x:"there is للمفرد وthere are للجمع. حروف المكان: in, on, under, next to, between, behind, in front of.",ex:["There is a sofa in the living room.","There are two windows in my room.","The keys are on the table, next to the lamp."],vt:"البيت",w:"kitchen, bedroom, bathroom, living room, sofa, bed, fridge, door, stairs, garden",k:["صف غرفتك في ٨ جمل","ارسم مخطط بيتك واكتب وصفه","خبّي شيء في البيت واكتب مكانه بدقة لشخص يدوره","حل تمارين prepositions of place"],r:["bc","cam"]},
{lv:"A1",t:"can / can't للقدرة",g:"Can for ability",x:"can + الفعل الأصلي بدون to. انتبه للنطق: can مخففة /kən/ وcan't واضحة.",ex:["I can swim.","She can't drive.","Can you speak English? — Yes, I can."],vt:"الرياضة والمهارات",w:"run, swim, ride a bike, play tennis, climb, jump, dance, cook, draw, type",k:["اكتب ١٠ أشياء تقدر تسويها و٥ ما تقدر","سجّل نفسك تنطق جمل فيها can وcan't وقارن مع YouGlish","اسأل ٣ أشخاص بـ Can you …? واكتب أجوبتهم","شاهد درس نطق can/can't"],r:["rachel","yg"]},
{lv:"A1",rv:1,t:"مراجعة واختبار نهاية A1",g:"A1 checkpoint",x:"قيّم نفسك: هل تقدر تعرّف بنفسك، تحكي روتينك، تصف بيتك، وتسأل أسئلة بسيطة؟",ex:["I usually wake up at 6. I go to school by car.","There is a big garden in my house.","I can't swim, but I can ride a bike."],vt:"كل مفردات A1",w:"راجع حوالي ١٣٠ كلمة",k:["راجع كل بطاقات Anki","اكتب ١٥٠ كلمة: My week وصحّحها في Write & Improve","حل تمارين A1 كاملة في British Council وسجّل نتيجتك","سجّل ٣ دقائق عن نفسك وروتينك وهواياتك بدون ورقة"],r:["wi","bc","anki"]},

{lv:"A2",t:"المضارع المستمر",g:"Present continuous",x:"am/is/are + فعل ing للي يصير الحين أو هالفترة. الإملاء: make → making، run → running.",ex:["I'm studying now.","She is wearing a black abaya.","What are you doing?"],vt:"الملابس",w:"shirt, dress, jacket, shoes, trousers, scarf, hat, wear, put on, take off",k:["صف ٥ صور: ماذا يفعل الناس الآن؟","اكتب ماذا تفعل عائلتك الآن","تمرين إملاء ing على ٢٠ فعل","استمع لمحادثة A2 في ELLLO"],r:["elllo","bc"]},
{lv:"A2",t:"البسيط مقابل المستمر",g:"Present simple vs continuous",x:"البسيط للعادة والمستمر للحظة الحالية. أفعال الحالة مثل like, know, want, need لا تأتي غالباً بالمستمر.",ex:["I usually walk, but today I'm taking a taxi.","It rains a lot in winter. It's raining now.","I know the answer. (not: I'm knowing)"],vt:"الطقس",w:"sunny, rainy, cloudy, windy, hot, cold, humid, storm, temperature, degree",k:["١٥ جملة اختيار بين الزمنين","اكتب نشرة طقس للدمام اليوم","احفظ ١٠ أفعال حالة","اقرأ خبر طقس في News in Levels"],r:["nil","bc"]},
{lv:"A2",t:"المعدود وغير المعدود",g:"some / any / much / many",x:"many مع المعدود وmuch مع غير المعدود. some في الإثبات وany في النفي والسؤال غالباً.",ex:["How much sugar do you need?","How many apples are there?","Is there any milk? — There's some in the fridge."],vt:"التسوق",w:"price, cheap, expensive, cash, card, receipt, discount, size, buy, pay",k:["صنّف ٣٠ اسماً: معدود أو غير معدود","اكتب حوار في سوبرماركت","اكتب قائمة مشتريات بالكميات: a bottle of, a kilo of, a loaf of","حل تمارين countable/uncountable"],r:["bc","peg"]},
{lv:"A2",t:"الماضي من to be",g:"was / were",x:"was مع I/he/she/it، وwere مع you/we/they.",ex:["I was at home yesterday.","Were you tired after school?","The weather wasn't good last week."],vt:"أماكن المدينة",w:"hospital, mall, mosque, park, bank, library, museum, airport, beach, station",k:["اكتب وين كنت كل يوم الأسبوع الماضي","صف مكان زرته وأنت صغير","اكتب حوار: Where were you …?","شاهد درس was/were في BBC"],r:["bbc","bc"]},
{lv:"A2",t:"الماضي البسيط للأفعال المنتظمة",g:"Past simple: regular verbs & -ed",x:"نضيف ed. النطق ثلاثة: /t/ بعد الأصوات المهموسة (watched)، /d/ بعد المجهورة (played)، /ɪd/ بعد t وd (wanted).",ex:["I watched a film last night.","She studied for two hours.","We visited our grandparents."],vt:"أفعال منتظمة",w:"visit, start, finish, call, ask, answer, help, clean, arrive, decide",k:["صنّف ٢٠ فعلاً حسب نطق ed","اكتب يومياتك لأمس في ٨ جمل","ابحث watched, wanted, played في YouGlish","Shadowing ٥ دقائق على نص بالماضي"],r:["yg","peg"]},
{lv:"A2",t:"أهم ٥٠ فعل شاذ",g:"Past simple: irregular verbs",x:"ما لها قاعدة، تنحفظ. ابدأ بالأكثر استخداماً واحفظها كجمل مو كقائمة.",ex:["go → went, see → saw, eat → ate","buy → bought, think → thought","I took the bus and came home late."],vt:"أفعال شاذة",w:"go, see, eat, drink, buy, take, make, get, give, come (+ ٤٠ في قائمتك)",k:["احفظ ٢٥ فعلاً اليوم في Anki (الباقي بكرة ضمن المراجعة)","اكتب قصة ١٠ جمل فيها ١٥ فعل شاذ","اختبر نفسك كتابةً من الذاكرة","اقرأ خبر مستوى ١ في Breaking News English"],r:["peg","bne","anki"]},
{lv:"A2",rv:1,t:"مراجعة الأسبوع الثالث",g:"Review: present & past",x:"ثبّت الأفعال الشاذة الخمسين والفرق بين البسيط والمستمر.",ex:["Last summer I went to Abha. It was cool and green.","Right now I'm writing; I usually write at night."],vt:"مراجعة",w:"راجع ٥٠ فعل شاذ + مفردات الأسبوع",k:["أكمل حفظ الـ٥٠ فعل الشاذ","اكتب ١٥٠ كلمة: My last holiday وصحّحها في Write & Improve","استمع لحلقة 6 Minute English مع النص","محادثة ١٠ دقائق مع شريك في Tandem أو سجّل نفسك"],r:["six","wi","tandem"]},
{lv:"A2",t:"السؤال والنفي في الماضي",g:"Past simple: did / didn't",x:"did وdidn't والفعل بعدها يرجع لأصله: Did you go? (not: went).",ex:["Did you travel last summer?","I didn't go out yesterday.","Where did you go? What did you see?"],vt:"السفر",w:"ticket, passport, flight, hotel, luggage, trip, abroad, book, check in, souvenir",k:["اكتب ١٥ سؤال بـ did عن إجازة","اكتب مقابلة تخيلية مع مسافر","اكتب ١٢٠ كلمة عن رحلة حقيقية أو خيالية","اقرأ قصة سفر في VOA"],r:["voa","bc"]},
{lv:"A2",t:"المقارنة",g:"Comparatives",x:"الصفات القصيرة: er + than. الطويلة: more + الصفة + than. الشاذة: good → better، bad → worse، far → farther.",ex:["Riyadh is bigger than Dammam.","This book is more interesting than that one.","My English is better now."],vt:"الوصف",w:"tall, short, young, old, friendly, quiet, crowded, modern, beautiful, dangerous",k:["قارن بين مدينتين في ١٠ جمل","قارن بين شخصين من عائلتك","اكتب جدول الصفات الشاذة واحفظه","حل تمارين comparatives"],r:["bc","peg"]},
{lv:"A2",t:"التفضيل",g:"Superlatives",x:"the + est للقصيرة، the most للطويلة. good → the best، bad → the worst.",ex:["The Rub' al Khali is one of the largest sand deserts in the world.","It's the most beautiful place I've seen.","She is the best student in class."],vt:"الجغرافيا",w:"mountain, desert, river, sea, island, coast, valley, lake, population, capital",k:["اكتب ١٠ حقائق عن السعودية بالتفضيل (ابحث وتأكد)","سوّ كويز من ٥ أسئلة: What is the … ?","شاهد فيديو جغرافيا في TED-Ed بترجمة إنجليزية","حل تمارين superlatives"],r:["ted","bc"]},
{lv:"A2",t:"going to للخطط",g:"Be going to",x:"للخطط المقررة وللتوقع المبني على دليل واضح.",ex:["I'm going to study engineering.","Look at the clouds. It's going to rain.","What are you going to do this weekend?"],vt:"الخطط والمستقبل",w:"next week, tonight, plan, goal, future, university, apply, graduate, career, dream",k:["اكتب خطتك للأسبوع القادم في ١٠ جمل","اكتب ١٠٠ كلمة عن خططك للجامعة","سجّل دقيقتين: My plans","استمع لمحادثة عن الخطط في ELLLO"],r:["elllo","bc"]},
{lv:"A2",t:"will وhave to وmust",g:"Will + obligation",x:"will للتنبؤ والقرار اللحظي والعرض. must وhave to للإلزام. انتبه: mustn't = ممنوع، don't have to = مو لازم.",ex:["I think AI will change medicine.","I'll help you with that.","You mustn't use your phone in the exam. You don't have to come early."],vt:"القوانين والدراسة",w:"rule, allowed, forbidden, uniform, exam, homework, grade, deadline, attend, late",k:["اكتب ١٠ تنبؤات عن عام ٢٠٤٠ بـ will","اكتب قوانين بيتك أو مدرستك بـ must / have to","اكتب ٥ أزواج جمل تبيّن فرق mustn't وdon't have to","حل تمارين will و must"],r:["bc","peg"]},
{lv:"A2",t:"ضمائر المفعول والطلب المهذب",g:"Object pronouns + would like",x:"me, you, him, her, it, us, them بعد الفعل أو حرف الجر. would like أكثر أدباً من want.",ex:["Can you help me?","I'd like a cappuccino, please.","Could I have the bill, please?"],vt:"المطعم",w:"menu, order, waiter, bill, starter, main course, dessert, spicy, delicious, reservation",k:["اكتب حوار طلب في مطعم بعبارات مهذبة","مثّل الحوار وسجّله","اكتب تقييم مطعم في ٨٠ كلمة","ابحث نطق menu, dessert, reservation في Cambridge Dictionary"],r:["cam","bbc"]},
{lv:"A2",rv:1,t:"مراجعة واختبار نهاية A2",g:"A2 checkpoint",x:"قيّم نفسك: هل تحكي عن الماضي والمستقبل، تقارن، وتكتب رسالة قصيرة؟",ex:["Last year I visited …, and next year I'm going to …","It was the best trip of my life."],vt:"كل مفردات A2",w:"راجع حوالي ٣٠٠ كلمة",k:["راجع كل Anki","حل اختبار A2 Key تجريبي من Cambridge (Reading + Listening)","اكتب إيميل ١٠٠ كلمة لصديق عن خطط الإجازة","محادثة ١٥ دقيقة عن الماضي والمستقبل"],r:["ce","wi","anki"]},
{lv:"A2",t:"المضارع التام: ever / never",g:"Present perfect: experiences",x:"have/has + التصريف الثالث (V3) للتجارب في الحياة بدون تحديد وقت.",ex:["Have you ever been to London?","I've never eaten sushi.","She has visited five countries."],vt:"التجارب",w:"experience, try, visit, meet, win, lose, break, forget, ever, never",k:["اكتب ١٠ أسئلة Have you ever …? وجاوب بصدق","اكتب ١٠ أشياء ما سويتها أبداً","احفظ التصريف الثالث لأهم ٥٠ فعل","حل تمارين present perfect في British Council"],r:["bc","anki"]},
{lv:"A2",t:"التام مقابل الماضي + كتابة إيميل",g:"Present perfect vs past simple",x:"لو ذكرت وقت محدد (yesterday, in 2024) استخدم الماضي البسيط. بدون وقت أو له أثر الآن: المضارع التام.",ex:["I've been to Jeddah. I went there in 2024.","I've lost my keys. (I can't find them now)"],vt:"الإيميل",w:"Dear, regards, attached, reply, subject, request, inform, thanks for, looking forward to, sincerely",k:["١٥ جملة اختيار بين الزمنين","اكتب إيميل رسمي قصير تطلب فيه معلومات عن دورة","صحّحه في Write & Improve","اقرأ ٣ أخبار مستوى ٢ في News in Levels"],r:["wi","nil"]},

{lv:"B1",t:"التام: for / since / just / yet",g:"Present perfect: duration & recent actions",x:"for مع مدة (ten years)، since مع نقطة بداية (2016). just = توه، already = بالفعل، yet في النفي والسؤال.",ex:["I've lived here for ten years / since 2016.","I've just finished my homework.","Have you done it yet? — Not yet."],vt:"المشاريع",w:"project, progress, deadline, task, achieve, complete, improve, team, result, research",k:["اكتب ٨ جمل بـ for/since عن أشياء تسويها من زمان","اكتب تحديث عن مشروع تشتغل عليه: ما الذي أنجزته وما لم تنجزه بعد","حل تمارين for/since","استمع لحلقة 6 Minute English"],r:["six","bc"]},
{lv:"B1",t:"الماضي المستمر",g:"Past continuous + when / while",x:"لحدث كان مستمراً وقطعه حدث آخر، أو حدثين بنفس الوقت.",ex:["I was reading when the power went off.","While she was cooking, he was studying."],vt:"السرد",w:"suddenly, then, after that, finally, notice, realise, happen, accident, strange, scream",k:["اكتب قصة ١٥٠ كلمة تبدأ بـ It was raining …","احكِ قصة حقيقية مسجّلة دقيقتين","اقرأ قصة B1 في British Council","حل تمارين past continuous"],r:["bc","peg"]},
{lv:"B1",t:"used to",g:"Used to for past habits",x:"لعادات وحالات كانت في الماضي وانتهت. السؤال: Did you use to …? (بدون d).",ex:["I used to live in Abha.","Did you use to play outside?","There didn't use to be so many cars."],vt:"الطفولة",w:"childhood, toy, neighbour, primary school, scared, naughty, grow up, remember, miss, nostalgic",k:["اكتب ١٠ جمل عن طفولتك","قارن حياة جدّك أو جدّتك قديماً بالحين","سجّل دقيقتين عن طفولتك","اقرأ مقال مستوى ٣ في Breaking News English"],r:["bne","bc"]},
{lv:"B1",t:"الشرط الأول",g:"First conditional",x:"If + مضارع بسيط، will + فعل. لاحتمال حقيقي في المستقبل. unless = if not.",ex:["If we recycle, we will reduce waste.","Unless you study, you won't pass."],vt:"البيئة",w:"pollution, recycle, waste, climate change, renewable, emissions, protect, plastic, solar, ocean",k:["اكتب ١٠ جمل شرطية عن البيئة","اقرأ مقال بيئة في VOA واستخرج ١٠ كلمات جديدة","اكتب فقرة: How can we protect our seas?","Shadowing ٥ دقائق"],r:["voa","bc"]},
{lv:"B1",rv:1,t:"مراجعة الأسبوع الخامس",g:"Review: perfect tenses & narrative",x:"اختبر قدرتك على السرد بأزمنة مختلفة.",ex:["I've been interested in science since I was ten. I used to …"],vt:"مراجعة",w:"راجع مفردات الأسبوع",k:["راجع Anki","اكتب ٢٠٠ كلمة عن تجربة غيّرتك وصحّحها","استمع لحلقتين 6 Minute English: الأولى بدون نص ثم مع النص","محادثة ٢٠ دقيقة مع شريك لغة"],r:["six","wi","tandem"]},
{lv:"B1",t:"الشرط الثاني",g:"Second conditional",x:"If + ماضي بسيط، would + فعل. لموقف تخيلي أو غير مرجح. مع I تُستخدم were غالباً.",ex:["If I had a million riyals, I would build a lab.","If I were you, I'd apply."],vt:"الأحلام والتخيّل",w:"imagine, invent, wealthy, famous, superpower, choose, afford, prefer, opportunity, ambition",k:["جاوب ١٠ أسئلة What would you do if …?","اكتب ١٠ جمل تبيّن الفرق بين الشرط الأول والثاني","اكتب ١٢٠ كلمة: If I could change one thing …","شاهد فيديو TED-Ed واكتب ملخص ٥ جمل"],r:["ted","bc"]},
{lv:"B1",t:"أفعال النصيحة والإلزام",g:"should / ought to / must / have to",x:"should وought to للنصيحة. must إلزام من المتكلم، have to إلزام من الخارج. don't have to = مو ضروري.",ex:["You should sleep more.","You don't have to come.","You ought to see a doctor."],vt:"الصحة",w:"headache, fever, medicine, pharmacy, exercise, diet, healthy, injury, appointment, symptoms",k:["اكتب نصائح لصديق متوتر قبل الاختبار","اكتب حوار عند الطبيب","اكتب جدول الـmodals وفروقها","شاهد درس modals في BBC"],r:["bbc","bc"]},
{lv:"B1",t:"المبني للمجهول",g:"Passive voice (present & past)",x:"be + التصريف الثالث. نستخدمه لما يكون الفاعل غير مهم أو غير معروف.",ex:["Paper was invented in China.","Millions of phones are sold every year.","The bridge was built in 1990."],vt:"التقنية",w:"invent, discover, develop, device, software, data, network, robot, battery, design",k:["اكتب ١٠ حقائق عن اختراعات بالمجهول","حوّل ١٠ جمل من المعلوم إلى المجهول","اقرأ مقال تقني في VOA","اكتب كيف يُصنع شيء تحبه خطوة بخطوة بالمجهول"],r:["voa","peg"]},
{lv:"B1",t:"جمل الصلة",g:"Relative clauses",x:"who للعاقل، which لغير العاقل، that للاثنين، where للمكان، whose للملكية. الجملة غير المحددة بين فواصل ولا تستخدم that.",ex:["A doctor is someone who treats patients.","This is the lab where I work.","My sister, who lives in Riyadh, is a pharmacist."],vt:"التعريفات",w:"define, refer to, a kind of, someone, something, somewhere, describe, feature, purpose, tool",k:["عرّف ١٥ كلمة بجمل صلة (لعبة Taboo)","ادمج ١٠ أزواج جمل بجمل صلة","اكتب ٥ جمل غير محددة بالفواصل","حل تمارين relative clauses"],r:["bc","peg"]},

// ---------- state ----------
const KEY="eng60-progress-v1";
let S={done:{},tasks:{}};
try{const raw=localStorage.getItem(KEY); if(raw){const p=JSON.parse(raw); if(p&&p.done&&p.tasks)S=p;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderTrack(){
  const ranges={A1:[1,14],A2:[15,30],B1:[31,45],B2:[46,60]};
  $("#track").innerHTML=Object.keys(ranges).map(l=>{
    const [a,b]=ranges[l]; let c=0; for(let i=a;i<=b;i++) if(S.done[i]) c++;
    return `<span title="${l}"><i style="background:${LV[l].c};width:${c/(b-a+1)*100}%"></i></span>`;
  }).join("");
  const total=Object.values(S.done).filter(Boolean).length;
  $("#doneCount").textContent=AR(total);
  const next=D.find(d=>!S.done[d.n]);
  const cb=$("#continueBtn");
  if(!next){cb.textContent="أكملت المسار 🎉";cb.onclick=()=>openDay(60);}
  else{cb.textContent=total?`كمّل اليوم ${AR(next.n)}`:"ابدأ اليوم ١";cb.onclick=()=>openDay(next.n);}
}

function renderPlan(){
  $("#tab-plan").innerHTML=Object.keys(LV).map(l=>{
    const days=D.filter(d=>d.lv===l);
    return `<div class="level" style="--c:${LV[l].c}">
      <div class="level-head"><span class="tag" style="background:${LV[l].c}">${l}</span><h2>${LV[l].name}</h2><p>${LV[l].desc}</p></div>
      <div class="stations">${days.map(d=>`<button class="st${S.done[d.n]?" done":""}${d.rv?" review":""}" data-day="${d.n}" aria-label="اليوم ${d.n}: ${esc(d.t)}"><span class="n">${AR(d.n)}</span><span class="t">${esc(d.t)}<small class="en">${esc(d.g)}</small></span></button>`).join("")}</div>
    </div>`;
  }).join("");
  document.querySelectorAll(".st").forEach(b=>b.onclick=()=>openDay(+b.dataset.day));
}

  const isList=!(d.w.startsWith("راجع")||d.w==="—");
  sh.innerHTML=`
    <div class="sheet-top"><button class="iconbtn" id="closeBtn">إغلاق</button><span class="meta">${d.lv} · ${LV[d.lv].name}</span></div>
    <div class="meta">اليوم ${AR(n)} من ٦٠${d.rv?" — يوم مراجعة":""}</div>
    <h2 id="sheetTitle">${esc(d.t)}</h2>
    <div class="en meta" style="text-align:right">${esc(d.g)}</div>
    <div class="sec"><h3>الدرس</h3><p>${esc(d.x)}</p>${d.ex.map(e=>`<div class="ex en">${esc(e)}</div>`).join("")}</div>
    <div class="sec"><h3>مفردات اليوم: ${esc(d.vt)}</h3>
      ${isList?`<div class="chips">${words.map(w=>`<a class="chip en" target="_blank" rel="noopener" href="https://dictionary.cambridge.org/dictionary/english/${encodeURIComponent(w.split(" – ")[0].split("(")[0].trim().replace(/ /g,"-"))}">${esc(w)}</a>`).join("")}</div><p class="meta">اضغط الكلمة لتسمع نطقها في Cambridge Dictionary.</p>`:`<p>${esc(d.w)}</p>`}
    </div>
    <div class="sec"><h3>مهام اليوم</h3>${d.k.map((t,i)=>{const id=n+"-"+i;const on=!!S.tasks[id];return `<div class="task${on?" checked":""}"><input type="checkbox" id="t${id}" data-id="${id}" ${on?"checked":""}><label for="t${id}">${esc(t)}</label></div>`}).join("")}</div>
    <div class="sec"><h3>الروتين الثابت</h3><ul class="routine">${ROUTINE[d.lv].map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>
    <div class="sec"><h3>مصادر اليوم</h3><div class="chips">${d.r.map(k=>`<a class="chip" target="_blank" rel="noopener" href="${RES[k].u}">${esc(RES[k].n)}</a>`).join("")}</div></div>
    <div class="sheet-foot">
      <button class="btn" id="doneBtn">${S.done[n]?"إلغاء الإكمال":"علّم اليوم كمكتمل"}</button>
      ${n>1?`<button class="iconbtn" id="prevBtn">اليوم السابق</button>`:""}
      ${n<60?`<button class="iconbtn" id="nextBtn">اليوم التالي</button>`:""}
    </div>`;
  sh.querySelectorAll(".task input").forEach(cb=>cb.onchange=()=>{
    S.tasks[cb.dataset.id]=cb.checked; cb.parentElement.classList.toggle("checked",cb.checked);
    const all=d.k.every((_,i)=>S.tasks[n+"-"+i]);
    if(all&&!S.done[n]){S.done[n]=true;$("#doneBtn").textContent="إلغاء الإكمال";refresh();}
    save();
  });
  $("#doneBtn").onclick=()=>{S.done[n]=!S.done[n];save();refresh();$("#doneBtn").textContent=S.done[n]?"إلغاء الإكمال":"علّم اليوم كمكتمل";};
  $("#closeBtn").onclick=closeDay;
  if($("#prevBtn"))$("#prevBtn").onclick=()=>openDay(n-1);
  if($("#nextBtn"))$("#nextBtn").onclick=()=>openDay(n+1);
  sh.scrollTop=0;
  sh.classList.add("open"); $("#overlay").classList.add("open");
  $("#closeBtn").focus();
}
function closeDay(){$("#sheet").classList.remove("open");$("#overlay").classList.remove("open");const b=document.querySelector(`.st[data-day="${current}"]`);if(b)b.focus();}
$("#overlay").onclick=closeDay;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#sheet").classList.contains("open"))closeDay();});

function refresh(){renderTrack();renderPlan();}

document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["plan","how","res"].forEach(t=>$("#tab-"+t).hidden=(t!==b.dataset.tab));
});

renderHow();renderRes();refresh();
</script>
</body>
</html>
